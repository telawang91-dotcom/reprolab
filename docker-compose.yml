services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    environment:
      POSTGRES_DB: reprolab
      POSTGRES_USER: reprolab
      POSTGRES_PASSWORD: reprolab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reprolab -d reprolab"]
      interval: 5s
      timeout: 5s
      retries: 20

  sandbox:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    network_mode: none
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - ./backend/storage:/data:ro
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
