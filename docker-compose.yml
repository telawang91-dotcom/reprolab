services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    environment:
      POSTGRES_DB: reprolab
      POSTGRES_USER: reprolab
      POSTGRES_PASSWORD: reprolab
    ports:
      - "${REPROLAB_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reprolab -d reprolab"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: reprolab:latest
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        NODE_BASE: ${REPROLAB_NODE_BASE:-node:20-bookworm-slim}
        PYTHON_BASE: ${REPROLAB_PYTHON_BASE:-python:3.11-slim-bookworm}
        INSTALL_OS_PACKAGES: ${REPROLAB_INSTALL_OS_PACKAGES:-1}
        INSTALL_PYTHON_DEPS: ${REPROLAB_INSTALL_PYTHON_DEPS:-1}
        INSTALL_FRONTEND_DEPS: ${REPROLAB_INSTALL_FRONTEND_DEPS:-1}
    environment:
      DATABASE_URL: postgresql+psycopg://reprolab:reprolab@postgres:5432/reprolab
      STORAGE_DIR: /data/storage
      REPROLAB_RUNTIME_ENV_PATH: /data/config/runtime.env
      SANDBOX_BACKEND: host
      EMBEDDING_PRELOAD: "false"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HUNYUAN_BASE_URL: ${HUNYUAN_BASE_URL:-https://api.hunyuan.cloud.tencent.com/v1}
      HUNYUAN_API_KEY: ${HUNYUAN_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${REPROLAB_PORT:-3000}:3000"
      - "${REPROLAB_API_PORT:-8000}:8000"
    volumes:
      - reprolab_storage:/data/storage
      - reprolab_config:/data/config
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)); assert data == {'status':'ok','database':'online'}
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  sandbox:
    profiles: ["sandbox"]
    image: reprolab-sandbox:py311
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
      args:
        PYTHON_BASE: ${REPROLAB_PYTHON_BASE:-python:3.11-slim-bookworm}
    network_mode: none
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - ./backend/storage:/data:ro
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  reprolab_storage:
  reprolab_config:
